<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/frontend/favicon.ico">
  <title id="pageTitle">Loading...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-app {
      width: 100%;
      max-width: 720px;
      height: 80vh;
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 18px;
      font-weight: 700;
      background: #fafafa;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #dbeafe;
    }

    .message.bot {
      align-self: flex-start;
      background: #f1f5f9;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #888;
    }

    .send-button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 0 16px 12px 16px;
      font-size: 13px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header" id="chatHeader">Loading...</div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <input
        type="text"
        id="messageInput"
        class="chat-input"
        placeholder="Type your message..."
      />
      <button id="sendButton" class="send-button">Send</button>
    </div>

    <div class="status" id="statusText">Ready</div>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const chatHeader = document.getElementById("chatHeader");

    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const tenant = pathParts[0] === "agent" && pathParts[1] ? pathParts[1] : "generic";
    const sessionStorageKey = `clinic-ai-session:${tenant}`;
    let sessionId = window.localStorage.getItem(sessionStorageKey) || null;

    const API_URL = `/chat?tenant=${encodeURIComponent(tenant)}`;
    const CONFIG_URL = `/config/${encodeURIComponent(tenant)}`;

    function addMessage(text, sender) {
      const messageEl = document.createElement("div");
      messageEl.classList.add("message", sender);
      messageEl.textContent = text;
      chatMessages.appendChild(messageEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function loadTenantConfig() {
      try {
        const response = await fetch(CONFIG_URL);

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const config = await response.json();
        const businessName = config.business?.name || "Assistant";
        const greeting = config.conversation?.greeting || "Здраво! Како можам да ви помогнам денес?";

        chatHeader.textContent = businessName;
        document.title = businessName;

        chatMessages.innerHTML = "";
        addMessage(greeting, "bot");
      } catch (error) {
        chatHeader.textContent = "Assistant";
        document.title = "Assistant";
        chatMessages.innerHTML = "";
        addMessage("Здраво! Како можам да ви помогнам денес?", "bot");
        console.error("Failed to load tenant config:", error);
      }
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();

      if (!userMessage) {
        return;
      }

      addMessage(userMessage, "user");
      messageInput.value = "";
      sendButton.disabled = true;
      statusText.textContent = "Sending...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: userMessage,
            session_id: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const data = await response.json();
        if (data.session_id) {
          sessionId = data.session_id;
          window.localStorage.setItem(sessionStorageKey, sessionId);
        }
        addMessage(data.reply || "No reply returned from server.", "bot");
        statusText.textContent = "Ready";
      } catch (error) {
        addMessage("Error connecting to backend.", "bot");
        statusText.textContent = `Error: ${error.message}`;
      } finally {
        sendButton.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    loadTenantConfig();
  </script>
</body>
</html>
