<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/frontend/favicon.ico">
  <title id="pageTitle">Се вчитува...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-app {
      width: 100%;
      max-width: 720px;
      height: 80vh;
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 18px;
      font-weight: 700;
      background: #fafafa;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #dbeafe;
    }

    .message.bot {
      align-self: flex-start;
      background: #f1f5f9;
    }

    .booking-progress {
      display: none;
      padding: 14px 16px 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: linear-gradient(180deg, #f8fafc 0%, #eef6ff 100%);
      gap: 10px;
      flex-direction: column;
    }

    .booking-progress.visible {
      display: flex;
    }

    @keyframes bookingAlertPulse {
      0%, 100% {
        opacity: 0.35;
      }
      50% {
        opacity: 1;
      }
    }

    .booking-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .booking-progress-controls {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 54px;
      padding-bottom: 0;
    }

    .booking-progress-title {
      display: inline-block;
      position: relative;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      padding-bottom: 5px;
    }

    .booking-progress-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 2px;
      border-radius: 999px;
      background: #dc2626;
      animation: bookingAlertPulse 1.35s ease-in-out infinite;
    }

    .booking-progress-status {
      font-size: 12px;
      color: #334155;
      background: #dbeafe;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .booking-reset-button {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #1e3a8a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .booking-reset-button[hidden] {
      display: none;
    }

    .booking-reset-button:hover {
      border-color: #93c5fd;
      background: #eff6ff;
      color: #1d4ed8;
      transform: translateX(-50%) translateY(-1px);
    }

    .booking-reset-button:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .booking-reset-button::before {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      transform: translateX(-50%) translateY(-2px);
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.94);
      color: #f8fafc;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.18);
      z-index: 3;
    }

    .booking-reset-button:hover::before,
    .booking-reset-button:focus-visible::before {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .booking-reset-icon {
      font-size: 16px;
      line-height: 1;
      font-weight: 700;
    }

    .booking-progress-steps {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .booking-summary {
      display: none;
      width: 100%;
      margin: 0;
      padding: 16px;
      border: 1px solid #d7e4f5;
      border-radius: 16px;
      background:
        radial-gradient(circle at top right, rgba(96, 165, 250, 0.18), transparent 34%),
        linear-gradient(135deg, #f8fbff 0%, #eef6ff 58%, #f7fafc 100%);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.04);
      gap: 14px;
      flex-direction: column;
    }

    .booking-summary.visible {
      display: flex;
      align-self: stretch;
    }

    .booking-summary-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .booking-summary-title {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .booking-summary-subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: #475569;
    }

    .booking-summary-badge {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
    }

    .booking-summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .booking-summary-card {
      padding: 12px 13px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(191, 219, 254, 0.8);
    }

    .booking-summary-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
    }

    .booking-summary-value {
      margin-top: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.35;
    }

    .booking-summary-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .booking-summary-field {
      min-height: 58px;
      padding: 8px 11px 9px 11px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(203, 213, 225, 0.9);
    }

    .booking-summary-fields .booking-summary-label {
      font-size: 11px;
    }

    .booking-summary-fields .booking-summary-value {
      margin-top: 2px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
    }

    .booking-summary-note {
      display: none;
      padding: 14px 15px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(191, 219, 254, 0.9);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .booking-summary-note.visible {
      display: block;
    }

    .booking-summary-note-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #475569;
    }

    .booking-summary-note-value {
      margin-top: 8px;
      min-height: 92px;
      padding: 12px 13px;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid rgba(203, 213, 225, 0.95);
      color: #0f172a;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 640px) {
      .booking-summary-grid,
      .booking-summary-fields {
        grid-template-columns: 1fr;
      }
    }

    .booking-step {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      background: #e2e8f0;
      color: #475569;
      white-space: nowrap;
    }

    .booking-step.editable {
      position: relative;
      cursor: pointer;
      transform-origin: left center;
      padding-right: 14px;
      transition: box-shadow 0.22s ease, padding-right 0.22s ease;
    }

    .booking-step.editable::after {
      content: "✎";
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #166534;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(22, 101, 52, 0.28);
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(22, 101, 52, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .booking-step.editable:hover {
      padding-right: 40px;
      box-shadow: 0 0 0 1px rgba(22, 101, 52, 0.14);
    }

    .booking-step.editable:hover::after {
      opacity: 1;
    }

    .booking-step.done {
      background: #dcfce7;
      color: #166534;
    }

    .booking-step.active {
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
    }

    .message-structured {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .structured-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .structured-title {
      font-weight: 700;
    }

    .structured-list {
      margin: 0;
      padding-left: 18px;
    }

    .structured-list li {
      margin: 0;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #888;
    }

    .send-button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 0 16px 12px 16px;
      font-size: 13px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header" id="chatHeader">Се вчитува...</div>
    <div class="booking-progress" id="bookingProgress">
      <div class="booking-progress-header">
        <div class="booking-progress-title" id="bookingProgressTitle">Закажување во тек</div>
        <div class="booking-progress-controls">
          <div class="booking-progress-status" id="bookingProgressStatus">0 / 3</div>
          <button
            type="button"
            class="booking-reset-button"
            id="bookingResetButton"
            data-tooltip="Почни од почеток"
            aria-label="Почни од почеток"
            hidden
          >
            <span class="booking-reset-icon" aria-hidden="true">&#8634;</span>
          </button>
        </div>
      </div>
      <div class="booking-progress-steps" id="bookingProgressSteps"></div>
    </div>

    <div class="booking-summary" id="bookingSummary">
      <div class="booking-summary-header">
        <div>
          <div class="booking-summary-title" id="bookingSummaryTitle">Резиме на барањето</div>
          <div class="booking-summary-subtitle" id="bookingSummarySubtitle"></div>
        </div>
        <div class="booking-summary-badge" id="bookingSummaryBadge">Привремен термин</div>
      </div>
      <div class="booking-summary-grid">
        <div class="booking-summary-card">
          <div class="booking-summary-label">Услуга</div>
          <div class="booking-summary-value" id="bookingSummaryService"></div>
        </div>
        <div class="booking-summary-card">
          <div class="booking-summary-label">Термин</div>
          <div class="booking-summary-value" id="bookingSummaryAppointment"></div>
        </div>
      </div>
      <div class="booking-summary-fields" id="bookingSummaryFields"></div>
      <div class="booking-summary-note" id="bookingSummaryNote" hidden>
        <div class="booking-summary-note-label" id="bookingSummaryNoteLabel">Забелешка од пациентот</div>
        <div class="booking-summary-note-value" id="bookingSummaryNoteValue"></div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <input
        type="text"
        id="messageInput"
        class="chat-input"
        placeholder="Напишете порака..."
      />
      <button id="sendButton" class="send-button">Испрати</button>
    </div>

    <div class="status" id="statusText">Подготвено</div>
  </div>

  <script type="module">
    import { createChatTranscript, resolveTenantFromPath } from "./chat/chat-shell.js";
    import { bindTextInputSubmission, setInputBusyState } from "./chat/chat-input.js";

    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const chatHeader = document.getElementById("chatHeader");
    const bookingProgress = document.getElementById("bookingProgress");
    const bookingProgressTitle = document.getElementById("bookingProgressTitle");
    const bookingProgressStatus = document.getElementById("bookingProgressStatus");
    const bookingProgressSteps = document.getElementById("bookingProgressSteps");
    const bookingResetButton = document.getElementById("bookingResetButton");
    const bookingSummary = document.getElementById("bookingSummary");
    const bookingSummaryTemplate = bookingSummary.cloneNode(true);
    bookingSummary.remove();

    const tenant = resolveTenantFromPath(window.location.pathname, "generic");
    const sessionStorageKey = `clinic-ai-session:${tenant}`;
    let sessionId = window.localStorage.getItem(sessionStorageKey) || null;
    let isSending = false;

    const API_URL = `/chat?tenant=${encodeURIComponent(tenant)}`;
    const CONFIG_URL = `/config/${encodeURIComponent(tenant)}`;

    function bookingSummaryKey(summary) {
      if (!summary) {
        return null;
      }
      return JSON.stringify(summary);
    }

    function populateBookingSummaryElement(element, summary) {
      element.classList.add("visible");
      element.querySelector("#bookingSummaryTitle").textContent = summary.title || "Резиме на барањето";
      element.querySelector("#bookingSummarySubtitle").textContent = summary.subtitle || "";
      element.querySelector("#bookingSummaryBadge").textContent = summary.appointment_status || "Привремен термин";
      element.querySelector("#bookingSummaryService").textContent = summary.service_name || "Стоматолошка консултација";
      element.querySelector("#bookingSummaryAppointment").textContent = summary.appointment_display || "21 MAR 2026 \u0432\u043e 14:00";

      const fieldsContainer = element.querySelector("#bookingSummaryFields");
      fieldsContainer.innerHTML = "";
      for (const item of summary.fields || []) {
        const fieldEl = document.createElement("div");
        fieldEl.className = "booking-summary-field";

        const labelEl = document.createElement("div");
        labelEl.className = "booking-summary-label";
        labelEl.textContent = labelForField(item.field) || item.label || "";

        const valueEl = document.createElement("div");
        valueEl.className = "booking-summary-value";
        valueEl.textContent = item.value || "";

        fieldEl.appendChild(labelEl);
        fieldEl.appendChild(valueEl);
        fieldsContainer.appendChild(fieldEl);
      }

      const noteContainer = element.querySelector("#bookingSummaryNote");
      const noteLabel = element.querySelector("#bookingSummaryNoteLabel");
      const noteValue = element.querySelector("#bookingSummaryNoteValue");
      const summaryNote = String(summary.patient_note || summary.note || summary.notes || "").trim();
      if (summaryNote) {
        noteContainer.hidden = false;
        noteContainer.classList.add("visible");
        noteLabel.textContent = summary.note_label || "Забелешка од пациентот";
        noteValue.textContent = summaryNote;
      } else {
        noteContainer.hidden = true;
        noteContainer.classList.remove("visible");
        noteLabel.textContent = "Забелешка од пациентот";
        noteValue.textContent = "";
      }

      element.removeAttribute("id");
      element.querySelectorAll("[id]").forEach((node) => node.removeAttribute("id"));
      element.dataset.summaryKey = bookingSummaryKey(summary) || "";
      return element;
    }

    function appendCompletedBookingSummary(summary) {
      if (!summary) {
        return;
      }
      const entry = populateBookingSummaryElement(bookingSummaryTemplate.cloneNode(true), summary);
      chatMessages.appendChild(entry);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    let pendingCompletedSummary = null;
    let lastAppendedSummaryKey = null;

    const chatTranscript = createChatTranscript(chatMessages, {
      afterAppend({ sender }) {
        if (sender === "bot" && pendingCompletedSummary) {
          appendCompletedBookingSummary(pendingCompletedSummary);
          lastAppendedSummaryKey = bookingSummaryKey(pendingCompletedSummary);
          pendingCompletedSummary = null;
        }
      }
    });

    function addMessage(text, sender) {
      return chatTranscript.addMessage(text, sender);
    }

    async function performSend(userMessage, options = {}) {
      const { showUserMessage = true } = options;

      if (isSending) {
        return;
      }

      const trimmedMessage = String(userMessage || "").trim();
      if (!trimmedMessage) {
        return;
      }

      isSending = true;
      if (showUserMessage) {
        addMessage(trimmedMessage, "user");
      }
      messageInput.value = "";
      setInputBusyState({ input: messageInput, button: sendButton, isBusy: true });
      statusText.textContent = "Се испраќа...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: trimmedMessage,
            session_id: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const data = await response.json();
        if (data.session_id) {
          sessionId = data.session_id;
          window.localStorage.setItem(sessionStorageKey, sessionId);
        }
        updateBookingProgress(data.booking_progress);
        addMessage(data.reply || "Нема одговор од серверот.", "bot");
        statusText.textContent = data.session_status === "completed"
          ? "Барањето е завршено."
          : data.session_status === "collecting_contact"
            ? "Се собираат контакт податоци."
            : "Подготвено";
      } catch (error) {
        addMessage("Настана грешка при поврзување со системот.", "bot");
        statusText.textContent = `Грешка: ${error.message}`;
      } finally {
        isSending = false;
        setInputBusyState({ input: messageInput, button: sendButton, isBusy: false });
        messageInput.focus();
      }
    }

    function beginBookingFieldEdit(fieldName) {
      if (!sessionId || !fieldName) {
        return;
      }
      performSend(`__booking_edit__:${fieldName}`, { showUserMessage: false });
    }

    async function resetConversation() {
      if (isSending) {
        return;
      }

      sessionId = null;
      pendingCompletedSummary = null;
      lastAppendedSummaryKey = null;
      window.localStorage.removeItem(sessionStorageKey);
      updateBookingProgress(null);
      statusText.textContent = "Подготвено";
      messageInput.value = "";
      await loadTenantConfig();
      messageInput.focus();
    }

    function labelForField(fieldName) {
      if (fieldName === "name") return "Име";
      if (fieldName === "phone") return "Телефон";
      if (fieldName === "email") return "Е-пошта";
      return fieldName;
    }

    function progressTitleForPercent(percent) {
      if (!percent) {
        return "Закажување во тек - Податоци за пациент";
      }
      return `Закажување во тек - Податоци за пациент - ${percent}%`;
    }

    function displayValueForField(item) {
      if (!item || !item.value) {
        return labelForField(item?.field);
      }
      return item.value;
    }

    function updateBookingProgress(progress) {
      if (!progress || !progress.visible) {
        bookingProgress.classList.remove("visible");
        bookingProgressSteps.innerHTML = "";
        bookingProgressTitle.textContent = progressTitleForPercent(0);
        bookingProgressStatus.textContent = "0 / 3";
        bookingResetButton.hidden = true;
        return;
      }

      bookingProgress.classList.add("visible");
      bookingProgressTitle.textContent = progressTitleForPercent(progress.progress_percent || 0);
      bookingProgressStatus.textContent = `${progress.collection_status} / ${progress.collection_total}`;
      bookingResetButton.hidden = false;
      bookingProgressSteps.innerHTML = "";
      const currentSummaryKey = bookingSummaryKey(progress.summary);
      if (
        progress.reservation_status === "complete"
        && progress.summary
        && currentSummaryKey
        && currentSummaryKey !== lastAppendedSummaryKey
      ) {
        pendingCompletedSummary = progress.summary;
      }

      for (const item of progress.fields || []) {
        const stepEl = document.createElement("div");
        stepEl.className = "booking-step";
        if (item.done) {
          stepEl.classList.add("done");
          stepEl.classList.add("editable");
          stepEl.addEventListener("click", () => beginBookingFieldEdit(item.field));
        } else if (progress.next_field === item.field && progress.reservation_status !== "complete") {
          stepEl.classList.add("active");
        }
        stepEl.textContent = displayValueForField(item);
        bookingProgressSteps.appendChild(stepEl);
      }
    }

    async function loadTenantConfig() {
      try {
        const response = await fetch(CONFIG_URL);

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const config = await response.json();
        const businessName = config.business?.name || config.assistant?.name || "Асистент";
        const greeting = config.conversation?.greeting || "Здраво! Како можам да ви помогнам денес?";

        chatHeader.textContent = businessName;
        document.title = businessName;

        chatTranscript.clear();
        pendingCompletedSummary = null;
        lastAppendedSummaryKey = null;
        addMessage(greeting, "bot");
      } catch (error) {
        chatHeader.textContent = "Асистент";
        document.title = "Асистент";
        chatTranscript.clear();
        addMessage("Здраво! Како можам да ви помогнам денес?", "bot");
        console.error("Failed to load tenant config:", error);
      }
    }

    async function sendMessage() {
      const userMessage = messageInput.value.trim();
      await performSend(userMessage, { showUserMessage: true });
    }

    bindTextInputSubmission({
      input: messageInput,
      button: sendButton,
      onSubmit: sendMessage,
    });
    bookingResetButton.addEventListener("click", resetConversation);

    loadTenantConfig();
  </script>
</body>
</html>
