<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/frontend/favicon.ico">
  <title id="pageTitle">Се вчитува...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .chat-app {
      width: 100%;
      max-width: 720px;
      height: 80vh;
      background: #ffffff;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 18px;
      font-weight: 700;
      background: #fafafa;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #dbeafe;
    }

    .message.bot {
      align-self: flex-start;
      background: #f1f5f9;
    }

    .booking-progress {
      display: none;
      padding: 14px 16px 12px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: linear-gradient(180deg, #f8fafc 0%, #eef6ff 100%);
      gap: 10px;
      flex-direction: column;
    }

    .booking-progress.visible {
      display: flex;
    }

    .booking-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .booking-progress-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }

    .booking-progress-status {
      font-size: 12px;
      color: #334155;
      background: #dbeafe;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .booking-progress-steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .booking-step {
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      background: #e2e8f0;
      color: #475569;
    }

    .booking-step.done {
      background: #dcfce7;
      color: #166534;
    }

    .booking-step.active {
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
    }

    .message-structured {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .structured-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .structured-title {
      font-weight: 700;
    }

    .structured-list {
      margin: 0;
      padding-left: 18px;
    }

    .structured-list li {
      margin: 0;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
    }

    .chat-input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .chat-input:focus {
      border-color: #888;
    }

    .send-button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      padding: 0 16px 12px 16px;
      font-size: 13px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header" id="chatHeader">Се вчитува...</div>
    <div class="booking-progress" id="bookingProgress">
      <div class="booking-progress-header">
        <div class="booking-progress-title" id="bookingProgressTitle">Закажување во тек</div>
        <div class="booking-progress-status" id="bookingProgressStatus">0 / 3</div>
      </div>
      <div class="booking-progress-steps" id="bookingProgressSteps"></div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
      <input
        type="text"
        id="messageInput"
        class="chat-input"
        placeholder="Напишете порака..."
      />
      <button id="sendButton" class="send-button">Испрати</button>
    </div>

    <div class="status" id="statusText">Подготвено</div>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const chatHeader = document.getElementById("chatHeader");
    const bookingProgress = document.getElementById("bookingProgress");
    const bookingProgressStatus = document.getElementById("bookingProgressStatus");
    const bookingProgressSteps = document.getElementById("bookingProgressSteps");

    const pathParts = window.location.pathname.split("/").filter(Boolean);
    const tenant = pathParts[0] === "agent" && pathParts[1] ? pathParts[1] : "generic";
    const sessionStorageKey = `clinic-ai-session:${tenant}`;
    let sessionId = window.localStorage.getItem(sessionStorageKey) || null;
    let isSending = false;

    const API_URL = `/chat?tenant=${encodeURIComponent(tenant)}`;
    const CONFIG_URL = `/config/${encodeURIComponent(tenant)}`;

    function renderMessageContent(text) {
      const value = String(text || "");
      const lines = value.split(/\r?\n/);
      const hasStructuredLines = lines.some((line) => {
        const trimmed = line.trim();
        return trimmed.startsWith("• ") || trimmed.startsWith("– ");
      });

      if (!hasStructuredLines) {
        const textEl = document.createElement("div");
        textEl.className = "message-text";
        textEl.textContent = value;
        return textEl;
      }

      const wrapper = document.createElement("div");
      wrapper.className = "message-structured";

      let currentGroup = null;
      let currentList = null;

      for (const rawLine of lines) {
        const trimmed = rawLine.trim();

        if (!trimmed) {
          currentList = null;
          continue;
        }

        if (trimmed.startsWith("• ")) {
          currentGroup = document.createElement("div");
          currentGroup.className = "structured-group";

          const titleEl = document.createElement("div");
          titleEl.className = "structured-title";
          titleEl.textContent = trimmed.slice(2).trim();

          currentGroup.appendChild(titleEl);
          wrapper.appendChild(currentGroup);
          currentList = null;
          continue;
        }

        if (trimmed.startsWith("– ")) {
          if (!currentGroup) {
            currentGroup = document.createElement("div");
            currentGroup.className = "structured-group";
            wrapper.appendChild(currentGroup);
          }

          if (!currentList) {
            currentList = document.createElement("ul");
            currentList.className = "structured-list";
            currentGroup.appendChild(currentList);
          }

          const itemEl = document.createElement("li");
          itemEl.textContent = trimmed.slice(2).trim();
          currentList.appendChild(itemEl);
          continue;
        }

        const textEl = document.createElement("div");
        textEl.className = "message-text";
        textEl.textContent = trimmed;
        wrapper.appendChild(textEl);
        currentGroup = null;
        currentList = null;
      }

      return wrapper;
    }

    function addMessage(text, sender) {
      const messageEl = document.createElement("div");
      messageEl.classList.add("message", sender);
      messageEl.appendChild(renderMessageContent(text));
      chatMessages.appendChild(messageEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function labelForField(fieldName) {
      if (fieldName === "name") return "Име";
      if (fieldName === "phone") return "Телефон";
      if (fieldName === "email") return "Е-пошта";
      return fieldName;
    }

    function updateBookingProgress(progress) {
      if (!progress || !progress.visible) {
        bookingProgress.classList.remove("visible");
        bookingProgressSteps.innerHTML = "";
        bookingProgressStatus.textContent = "0 / 3";
        return;
      }

      bookingProgress.classList.add("visible");
      bookingProgressStatus.textContent = `${progress.collection_status} / ${progress.collection_total}`;
      bookingProgressSteps.innerHTML = "";

      for (const item of progress.fields || []) {
        const stepEl = document.createElement("div");
        stepEl.className = "booking-step";
        if (item.done) {
          stepEl.classList.add("done");
        } else if (progress.next_field === item.field && progress.reservation_status !== "complete") {
          stepEl.classList.add("active");
        }
        stepEl.textContent = labelForField(item.field);
        bookingProgressSteps.appendChild(stepEl);
      }
    }

    async function loadTenantConfig() {
      try {
        const response = await fetch(CONFIG_URL);

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const config = await response.json();
        const businessName = config.business?.name || config.assistant?.name || "Асистент";
        const greeting = config.conversation?.greeting || "Здраво! Како можам да ви помогнам денес?";

        chatHeader.textContent = businessName;
        document.title = businessName;

        chatMessages.innerHTML = "";
        addMessage(greeting, "bot");
      } catch (error) {
        chatHeader.textContent = "Асистент";
        document.title = "Асистент";
        chatMessages.innerHTML = "";
        addMessage("Здраво! Како можам да ви помогнам денес?", "bot");
        console.error("Failed to load tenant config:", error);
      }
    }

    async function sendMessage() {
      if (isSending) {
        return;
      }

      const userMessage = messageInput.value.trim();

      if (!userMessage) {
        return;
      }

      isSending = true;
      addMessage(userMessage, "user");
      messageInput.value = "";
      sendButton.disabled = true;
      messageInput.disabled = true;
      statusText.textContent = "Се испраќа...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: userMessage,
            session_id: sessionId
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }

        const data = await response.json();
        if (data.session_id) {
          sessionId = data.session_id;
          window.localStorage.setItem(sessionStorageKey, sessionId);
        }
        updateBookingProgress(data.booking_progress);
        addMessage(data.reply || "Нема одговор од серверот.", "bot");
        statusText.textContent = data.session_status === "completed"
          ? "Барањето е завршено."
          : data.session_status === "collecting_contact"
            ? "Се собираат контакт податоци."
            : "Подготвено";
      } catch (error) {
        addMessage("Настана грешка при поврзување со системот.", "bot");
        statusText.textContent = `Грешка: ${error.message}`;
      } finally {
        isSending = false;
        sendButton.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    loadTenantConfig();
  </script>
</body>
</html>
