[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -p no:cacheprovider

# Test execution hygiene for this repo:
# - Do not use repo-local pytest temp folders such as .pytest_*, _codex_pytest_tmp,
#   pytest_kai_temp, or similar fallbacks under the repo tree.
# - Prefer an external temp root and pass it explicitly through TMP, TEMP, and --basetemp.
# - Known-good external temp root in this workspace: F:\temp\clinic-ai-assistant
# - Prefer setting PYTHONDONTWRITEBYTECODE=1 during test runs to reduce __pycache__ churn.
